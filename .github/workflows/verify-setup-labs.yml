name: Verify C++ setup labs
on:
  push:
    paths:
      - 'DPC-05-dpc0-setup-and-tooling/**'
      - 'DPC-01-dpc0-setup-and-tooling-supplemental-2/**'
      - 'DPC-02-dpc0-setup-and-tooling-supplemental-3/**'
      - 'DPC-06-dpc1-why-patterns*/**'
      - 'DPC-07-dpc2-design-foundations/**'
      - 'DPC-07-dpc3-*/**'
      - 'DPC-08-dpc3-*/**'
      - 'DPC-08-dpc9-*/**'
      - 'DPC-19-dpc9-*/**'
      - 'DPC-20-dpc9-*/**'
      - 'tests/test_injected_services.py'
      - 'DPC-09-dpc12-capstone-studio/**'
      - 'DPC-15-dpc7-command-and-state-supplemental-2/**'
      - 'DPC-16-dpc7-command-and-state-supplemental-3/**'
      - 'tests/test_command_practice.py'
      - 'DPC3-Observer-Event-Hub/**'
      - 'DPC4-Facade-Adapter-Import-Tool/**'
      - 'tests/test_event_and_import.py'
      - 'tests/test_policy_observer.py'
      - 'DPC-09-dpc4-strategy-and-policy-based-design-supplemental-2/**'
      - 'DPC-10-dpc4-strategy-and-policy-based-design-supplemental-3/**'
      - 'DPC-11-dpc5-observer-and-event-flow-supplemental-2/**'
      - 'DPC-12-dpc5-observer-and-event-flow-supplemental-3/**'
      - 'tests/test_import_capstone.py'
      - 'DPC1-Factories-and-Builders-Workshop/**'
      - 'tests/dashboard_family.cpp'
      - 'DPC7-RAII-Resource-Manager/**'
      - 'tests/scope_exit.cpp'
      - 'CMakeLists.txt'
      - 'tests/test_setup_labs.py'
      - '.github/workflows/verify-setup-labs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-labs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install the JSON adapter build dependency
        run: |
          if ! pkg-config --atleast-version=0.15 json-c; then
            sudo apt-get update
            sudo apt-get install -y pkg-config libjson-c-dev
          fi
      - name: Build the starter, completed exercise and reference for each lab
        run: python3 tests/test_setup_labs.py
      - name: Verify creation and dependency injection starters and references
        run: python3 tests/test_injected_services.py
      - name: Build course demos and check an independent dashboard family
        run: |
          cmake -S . -B build -DCMAKE_CXX_FLAGS=-Werror
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: Verify the capstone baseline, reference and completed starter
        run: python3 tests/test_import_capstone.py
      - name: Exercise parsed editor commands and redo history
        run: python3 tests/test_command_practice.py
      - name: Check event delivery and equivalent import records
        run: python3 tests/test_event_and_import.py
      - name: Check scheduling policies and observer practice
        run: python3 tests/test_policy_observer.py
